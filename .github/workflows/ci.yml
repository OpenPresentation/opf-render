name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shaping-node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The metrics checks exercise actual SVG metadata, whose composition APIs
      # require the same unpublished core candidate used by the Linux job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: e4980f8b52dfad641d1db6c86ac3b0e8799c0bef
          path: core-candidate
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install coordinated core dependencies
        run: pnpm --dir core-candidate install --frozen-lockfile
      - name: Build coordinated core for SVG metadata checks
        run: pnpm --dir core-candidate --filter @openpresentation/opf build
      - name: Use coordinated core in the renderer
        run: npm install --ignore-scripts --no-save --package-lock=false ./core-candidate/packages/javascript
      - run: npm run build
      - run: npm run test:shaping
      - name: Install the pinned Chromium probe
        run: npx playwright install chromium
      - name: Record native variable advance diagnostics
        run: npm run test:variation-metrics-probe
      - name: Compare selected variable glyph painting
        run: npm run test:variation-paint-probe
      - name: Compare system Edge on Windows
        if: runner.os == 'Windows'
        env:
          OPF_FONT_PROBE_BROWSER_CHANNEL: msedge
        run: npm run test:variation-metrics-probe -- artifacts/font-shaping/variation-metrics/edge-native-probe.json
      - name: Compare selected variable glyph painting in Edge
        if: runner.os == 'Windows'
        env:
          OPF_FONT_PROBE_BROWSER_CHANNEL: msedge
        run: npm run test:variation-paint-probe -- artifacts/font-shaping/variation-paint-edge
      - name: Verify prepared glyph paths against independent RGBA pixels
        run: npm run test:painting-browser
      - name: Preserve shaping portability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: variable-font-portability-${{ runner.os }}
          path: artifacts/font-shaping/**
          retention-days: 7
          if-no-files-found: ignore
  package:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: opf-render
    env:
      OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf-render/test/golden/opf-examples-png.furniture.sha256.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-render
      # Unpublished shared APIs require the coordinated source graph. Registry
      # predecessor checks remain a release gate after core publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: e4980f8b52dfad641d1db6c86ac3b0e8799c0bef
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: 1363a653c8b0e80c50d970bc30db3587bcf6f14e
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: 8d6e313b83bf5f17414013cde1b410cf629c753d
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-render/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - run: npm audit
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:font-preparation
      - run: npm run test:font-variants
      - run: npm test
      - run: npm run test:code
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - run: npm run test:browser
      - run: npm run test:code-browser
      - run: npm run test:font-preparation-browser
      - run: npm run test:font-variants-browser
      - run: npm run test:shaping-browser
      - run: npm run test:plain-whitespace-browser
      - id: rich-flow
        run: npm run test:rich-flow-browser
      - if: ${{ success() || steps.rich-flow.conclusion == 'failure' }}
        run: npm run test:rich-spacing-browser
      - name: Install and exercise coordinated candidate tarballs
        working-directory: opf
        run: |
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
          pnpm test:packed-browser
          node scripts/test-installed-code-guards.mjs
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-workflow installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
      - run: npm pack --dry-run
      - name: Record native variable advance diagnostics
        run: npm run test:variation-metrics-probe
      - name: Compare selected variable glyph painting
        run: npm run test:variation-paint-probe
      - name: Verify prepared glyph paths against independent RGBA pixels
        id: shaped-painting
        run: npm run test:painting-browser
      - name: Verify fresh shaping packages including fixed variable instances
        id: shaping-packed
        if: ${{ success() || steps.shaped-painting.conclusion == 'failure' }}
        run: npm run test:shaping-packed
      # Keep the unresolved variable advance gate visible without skipping the
      # existing installed-package and coordinated acceptance steps above.
      - name: Verify fixed variable instances against browser advances and pixels
        if: ${{ success() || steps.shaped-painting.conclusion == 'failure' || steps.shaping-packed.conclusion == 'failure' }}
        run: npm run test:variations-browser
      - name: Preserve candidate and raster evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-opf-render-${{ runner.os }}-node24
          path: |
            opf/artifacts/editor/*report.json
            opf/artifacts/editor/json-editor-installed.json
            opf/artifacts/editor/*failure.png
            opf/artifacts/editor/*installed-code*.json
            opf-render/artifacts/golden/**
            opf-render/artifacts/font-preparation*.json
            opf-render/artifacts/font-variants*.json
            opf-render/artifacts/font-shaping/**
            opf/artifacts/plain-whitespace-workflow/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/timeline-acceptance.json
            opf-render/artifacts/plain-whitespace-browser/**
            opf-render/artifacts/rich-flow-browser/**
            opf-render/artifacts/rich-spacing-browser/**
          retention-days: 7
          if-no-files-found: ignore
